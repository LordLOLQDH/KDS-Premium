<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Passwort festlegen – KDS Premium</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background: #08090b;

            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .box {
            width: 100%;
            max-width: 420px;

            padding: 32px;

            background: #111317;

            border: 1px solid #24272d;

            border-radius: 16px;
        }

        h1 {
            margin: 0 0 10px;

            font-size: 28px;
        }

        .subtitle {
            margin-bottom: 28px;

            color: #9da3ad;

            line-height: 1.6;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            color: #b8bdc6;
        }

        input {
            width: 100%;

            padding: 14px;

            margin-bottom: 18px;

            border: 1px solid #2b2f36;

            border-radius: 8px;

            background: #17191e;

            color: #ffffff;

            font-size: 16px;

            outline: none;
        }

        input:focus {
            border-color: #ffffff;
        }

        button {
            width: 100%;

            padding: 14px;

            border: 0;

            border-radius: 8px;

            background: #ffffff;

            color: #0d0f12;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;

            cursor: wait;
        }

        .message {
            display: none;

            margin-top: 18px;

            padding: 13px;

            border-radius: 8px;

            font-size: 14px;

            line-height: 1.5;
        }

        .success {
            display: block;

            background: #17221a;

            border: 1px solid #29412f;

            color: #a9d6b2;
        }

        .error {
            display: block;

            background: #241719;

            border: 1px solid #4a292d;

            color: #e7a9af;
        }

        .login {
            display: none;

            margin-top: 20px;

            text-align: center;
        }

        .login a {
            color: #ffffff;

            text-decoration: underline;
        }

    </style>
</head>

<body>

<div class="box">

    <h1>Passwort festlegen</h1>

    <div class="subtitle">
        Lege jetzt dein persönliches Passwort
        für deinen KDS Premium-Zugang fest.
    </div>


    <form id="passwordForm">

        <label for="password">
            Neues Passwort
        </label>

        <input
            id="password"
            type="password"
            minlength="8"
            autocomplete="new-password"
            placeholder="Mindestens 8 Zeichen"
            required
        >


        <label for="passwordConfirm">
            Passwort wiederholen
        </label>

        <input
            id="passwordConfirm"
            type="password"
            minlength="8"
            autocomplete="new-password"
            placeholder="Passwort wiederholen"
            required
        >


        <button
            id="submitButton"
            type="submit"
        >
            Passwort festlegen
        </button>

    </form>


    <div
        id="message"
        class="message"
    ></div>


    <div
        id="login"
        class="login"
    >
        <a href="login.html">
            Zum Login
        </a>
    </div>

</div>


<script type="module">

    import {
        createClient
    }
    from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    // ========================================
    // SUPABASE
    // ========================================

    const SUPABASE_URL =
        "https://wpsgjzqbwpyfpmdawwnn.supabase.co";


    const SUPABASE_ANON_KEY =
        "sb_publishable_flgB5CSE4scG3m3Fyx5lUA_GfLn6xh6";


    const supabase =
        createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    // ========================================
    // ELEMENTE
    // ========================================

    const form =
        document.getElementById(
            "passwordForm"
        );


    const password =
        document.getElementById(
            "password"
        );


    const passwordConfirm =
        document.getElementById(
            "passwordConfirm"
        );


    const submitButton =
        document.getElementById(
            "submitButton"
        );


    const message =
        document.getElementById(
            "message"
        );


    const login =
        document.getElementById(
            "login"
        );


    // ========================================
    // URL / SESSION
    // ========================================

    async function checkSession() {

        const {
            data,
            error
        } =
            await supabase.auth.getSession();


        if (error) {

            showMessage(
                "Der Passwort-Link konnte nicht überprüft werden.",
                "error"
            );

            return false;
        }


        if (!data.session) {

            showMessage(

                "Dieser Passwort-Link ist ungültig oder abgelaufen. Bitte fordere einen neuen Link an.",

                "error"

            );

            return false;
        }


        return true;
    }


    // ========================================
    // PASSWORT SPEICHERN
    // ========================================

    form.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();


            const newPassword =
                password.value.trim();


            const confirmation =
                passwordConfirm.value.trim();


            // --------------------------------
            // MINDESTLÄNGE
            // --------------------------------

            if (
                newPassword.length < 8
            ) {

                showMessage(

                    "Das Passwort muss mindestens 8 Zeichen lang sein.",

                    "error"

                );

                return;
            }


            // --------------------------------
            // VERGLEICH
            // --------------------------------

            if (
                newPassword !==
                confirmation
            ) {

                showMessage(

                    "Die Passwörter stimmen nicht überein.",

                    "error"

                );

                return;
            }


            // --------------------------------
            // BUTTON
            // --------------------------------

            submitButton.disabled =
                true;

            submitButton.textContent =
                "Passwort wird gespeichert...";


            try {

                // ----------------------------
                // SESSION PRÜFEN
                // ----------------------------

                const valid =
                    await checkSession();


                if (!valid) {

                    submitButton.disabled =
                        false;

                    submitButton.textContent =
                        "Passwort festlegen";

                    return;
                }


                // ----------------------------
                // PASSWORT ÄNDERN
                // ----------------------------

                const {
                    error
                } =
                    await supabase.auth.updateUser({

                        password:
                            newPassword

                    });


                if (error) {

                    throw error;
                }


                // ----------------------------
                // ERFOLG
                // ----------------------------

                form.style.display =
                    "none";


                showMessage(

                    "Dein Passwort wurde erfolgreich festgelegt. Du kannst dich jetzt anmelden.",

                    "success"

                );


                login.style.display =
                    "block";


            }

            catch (error) {

                console.error(
                    error
                );


                showMessage(

                    error.message ||
                    "Das Passwort konnte nicht gespeichert werden.",

                    "error"

                );


                submitButton.disabled =
                    false;

                submitButton.textContent =
                    "Passwort festlegen";

            }

        }
    );


    // ========================================
    // NACHRICHT
    // ========================================

    function showMessage(
        text,
        type
    ) {

        message.textContent =
            text;


        message.className =
            "message " +
            type;

    }


    // ========================================
    // START
    // ========================================

    checkSession();

</script>

</body>
</html>
